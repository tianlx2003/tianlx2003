<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="200" cy="200" r="190" />
    </clipPath>
  </defs>
  <!-- 背景圆圈 -->
  <circle cx="200" cy="200" r="195" fill="#f0e3d2" stroke="rgba(255,255,255,0.8)" stroke-width="6" />
  <!-- 你的海滩照片（已自动居中人像） -->
  <g clip-path="url(#avatar-clip)">
    <image xlink:href="photo.jpg" href="photo.jpg" x="-150" y="-50" width="700" height="466" preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>
